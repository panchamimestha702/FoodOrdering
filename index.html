
<!DOCTYPE html>
<html>
<head>
  <title>Food Ordering</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Food Ordering System</h1>

  <div class="food">
    <h2>Pizza - ₹150</h2>
    <button onclick="addFood(150)">Add to Cart</button>
  </div>

  <div class="food">
    <h2>Burger - ₹100</h2>

  </div>

  <h2 id="total">Total: ₹0</h2>
  <button onclick="orderFood()">Place Order</button>
  <h3 id="status"></h3>

  <script src="script.js"></script>
</body>
</html>
